<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">YouTube Stream Analyzerのロードマップ</title>
  <desc id="desc">アーカイブ収集、予約収集、リアルタイム解析、文脈を踏まえた切り抜き支援の4段階を、上昇する道として表現している。</desc>
  <defs>
    <linearGradient id="road" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#2563eb"/><stop offset=".52" stop-color="#0891b2"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <linearGradient id="goal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7c3aed"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="13" stdDeviation="15" flood-color="#000" flood-opacity=".25"/></filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>

  <circle cx="1012" cy="106" r="106" fill="#7c3aed" opacity=".22" filter="url(#glow)"/>
  <path d="M102 505 C275 505 234 368 414 368 C600 368 560 236 752 236 C888 236 897 112 1038 112" fill="none" stroke="#fff" stroke-opacity=".09" stroke-width="92" stroke-linecap="round"/>
  <path d="M102 505 C275 505 234 368 414 368 C600 368 560 236 752 236 C888 236 897 112 1038 112" fill="none" stroke="url(#road)" stroke-width="18" stroke-linecap="round"/>
  <path d="M1038 112 1015 97M1038 112l-18 21" fill="none" stroke="#9e7cff" stroke-width="8" stroke-linecap="round"/>

  <g transform="translate(35 386)" filter="url(#shadow)">
    <rect width="270" height="170" rx="28" fill="#fff"/>
    <rect x="22" y="20" width="78" height="30" rx="15" fill="#eaf2ff"/>
    <text x="61" y="41" text-anchor="middle" fill="#2563eb" font-family="sans-serif" font-size="13" font-weight="700">PHASE 1</text>
    <circle cx="48" cy="91" r="24" fill="#2563eb"/>
    <path d="M39 80h18v20H39Zm5 5h8m-8 6h8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <text x="86" y="88" fill="#142033" font-family="sans-serif" font-size="20" font-weight="700">アーカイブ収集</text>
    <text x="86" y="113" fill="#657085" font-family="sans-serif" font-size="12">指定した配信を集めて閲覧</text>
    <text x="22" y="145" fill="#506076" font-family="sans-serif" font-size="12" font-weight="700">確実に集める・保存する・見られる</text>
  </g>

  <g transform="translate(324 275)" filter="url(#shadow)">
    <rect width="270" height="170" rx="28" fill="#fff"/>
    <rect x="22" y="20" width="78" height="30" rx="15" fill="#e5f7fb"/>
    <text x="61" y="41" text-anchor="middle" fill="#0891b2" font-family="sans-serif" font-size="13" font-weight="700">PHASE 2</text>
    <circle cx="48" cy="91" r="24" fill="#0891b2"/>
    <circle cx="48" cy="91" r="13" fill="none" stroke="#fff" stroke-width="3"/><path d="M48 82v10l7 4" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <text x="86" y="88" fill="#142033" font-family="sans-serif" font-size="20" font-weight="700">予約収集</text>
    <text x="86" y="113" fill="#657085" font-family="sans-serif" font-size="12">配信終了後に自動で収集</text>
    <text x="22" y="145" fill="#506076" font-family="sans-serif" font-size="12" font-weight="700">URLを事前登録し、待ち時間を減らす</text>
  </g>

  <g transform="translate(620 143)" filter="url(#shadow)">
    <rect width="270" height="170" rx="28" fill="#fff"/>
    <rect x="22" y="20" width="78" height="30" rx="15" fill="#eee8ff"/>
    <text x="61" y="41" text-anchor="middle" fill="#7c3aed" font-family="sans-serif" font-size="13" font-weight="700">PHASE 3</text>
    <circle cx="48" cy="91" r="24" fill="#7c3aed"/>
    <path d="M33 92h6l4-11 7 22 5-11h8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="86" y="88" fill="#142033" font-family="sans-serif" font-size="20" font-weight="700">リアルタイム解析</text>
    <text x="86" y="113" fill="#657085" font-family="sans-serif" font-size="12">配信中からイベントを蓄積</text>
    <text x="22" y="145" fill="#506076" font-family="sans-serif" font-size="12" font-weight="700">盛り上がり候補を随時更新する</text>
  </g>

  <g transform="translate(906 22)" filter="url(#shadow)">
    <rect width="270" height="198" rx="30" fill="url(#goal)"/>
    <rect x="22" y="20" width="78" height="30" rx="15" fill="#fff" fill-opacity=".18"/>
    <text x="61" y="41" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="13" font-weight="700">PHASE 4</text>
    <circle cx="48" cy="96" r="24" fill="#fff" fill-opacity=".2"/>
    <circle cx="44" cy="91" r="9" fill="none" stroke="#fff" stroke-width="3"/><path d="m51 98 9 9" stroke="#fff" stroke-width="4" stroke-linecap="round"/><path d="M34 110c5-8 19-8 24 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <text x="86" y="88" fill="#fff" font-family="sans-serif" font-size="20" font-weight="700">切り抜き支援</text>
    <text x="86" y="113" fill="#e8ddff" font-family="sans-serif" font-size="12">複数視点と文脈から候補を提示</text>
    <rect x="22" y="140" width="226" height="36" rx="12" fill="#fff" fill-opacity=".14"/>
    <text x="135" y="163" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="12" font-weight="700">制作判断に使える理由まで示す</text>
  </g>

  <g transform="translate(72 585)">
    <circle cx="0" cy="0" r="5" fill="#2563eb"/><text x="15" y="5" fill="#9ab0ca" font-family="sans-serif" font-size="12">収集基盤</text>
    <circle cx="112" cy="0" r="5" fill="#0891b2"/><text x="127" y="5" fill="#9ab0ca" font-family="sans-serif" font-size="12">自動化</text>
    <circle cx="212" cy="0" r="5" fill="#7c3aed"/><text x="227" y="5" fill="#9ab0ca" font-family="sans-serif" font-size="12">分析・文脈</text>
  </g>
</svg>
