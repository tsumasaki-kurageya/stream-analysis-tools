[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "stream-analysis-worker"
version = "0.1.0"
description = "Background collection worker for Stream Analysis Tools"
requires-python = ">=3.12,<3.15"
dependencies = [
  "psycopg[binary]==3.3.4",
  "psycopg-pool==3.3.1",
  "yt-dlp==2026.7.4",
]

[project.scripts]
stream-analysis-worker = "stream_analysis_worker.app:main"

[dependency-groups]
dev = [
  "mypy==1.18.2",
  "pytest==8.4.2",
  "ruff==0.12.12",
  "testcontainers[postgres]==4.15.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/stream_analysis_worker"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: requires a running Docker daemon for PostgreSQL Testcontainers",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
