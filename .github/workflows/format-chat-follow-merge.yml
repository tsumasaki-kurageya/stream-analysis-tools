name: Format rebuilt Chat follow

on:
  push:
    branches:
      - agent/issue-59-chat-auto-follow

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/issue-59-chat-auto-follow
      - uses: actions/setup-node@v6
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npx prettier --write src/App.tsx
        working-directory: apps/web
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/App.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Format rebuilt Chat follow source (#59)"
          git push origin HEAD:agent/issue-59-chat-auto-follow
