name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  contract:
    name: OpenAPI Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
          cache-dependency-path: apps/api/go.sum
      - run: make contract-bootstrap
      - run: go mod download
        working-directory: apps/api
      - run: make contract-check

  web:
    name: Web UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: make check build

  api:
    name: Main API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
          cache: false
      - run: make check build

  worker:
    name: Collection Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.13.15
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.11.33
          enable-cache: true
          cache-dependency-glob: apps/worker/uv.lock
      - run: uv sync --frozen --all-groups
      - run: make check build

  postgres:
    name: PostgreSQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
          cache-dependency-path: apps/api/go.sum
      - run: bash -n infrastructure/postgres/init/10-create-test-database.sh scripts/postgres-wait.sh tests/postgres/compose-smoke.sh
      - run: shellcheck infrastructure/postgres/init/10-create-test-database.sh scripts/postgres-wait.sh tests/postgres/compose-smoke.sh
      - run: make db-smoke
      - run: make db-integration-test
