name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    name: Finalize stream list read model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
          cache: false
      - run: python3 scripts/finalize-issue-56.py
      - run: gofmt -w apps/api/internal/httpapi/router.go
      - name: Commit finalized router and restore CI
        run: |
          git fetch origin agent/issue-54-app-shell --depth=1
          git checkout FETCH_HEAD -- .github/workflows/ci.yml
          git rm scripts/finalize-issue-56.py
          git add apps/api/internal/httpapi/router.go .github/workflows/ci.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Map stream list read model to HTTP response (#56)"
          git push origin HEAD:${{ github.head_ref }}

  contract:
    name: OpenAPI Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
          cache-dependency-path: apps/api/go.sum
      - run: make contract-bootstrap
      - run: go mod download
        working-directory: apps/api
      - run: make contract-check

  web:
    name: Web UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: make check build
      - run: npm run test:e2e

  api:
    name: Main API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
          cache: false
      - run: make check build
