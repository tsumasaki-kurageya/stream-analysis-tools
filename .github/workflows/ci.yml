name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  contract:
    name: OpenAPI Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
          cache-dependency-path: apps/api/go.sum
      - run: make contract-bootstrap
      - run: go mod download
        working-directory: apps/api
      - run: make contract-generate
      - name: Commit generated contracts and restore CI workflow
        run: |
          git fetch origin agent/issue-54-app-shell --depth=1
          git checkout FETCH_HEAD -- .github/workflows/ci.yml
          git add apps/api/internal/generated/openapiv1/api.gen.go apps/web/src/api/generated/v1.ts .github/workflows/ci.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Regenerate OpenAPI clients for stream list read model (#56)"
          git push origin HEAD:${{ github.head_ref }}

  web:
    name: Web UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: make check build
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  api:
    name: Main API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
          cache: false
      - run: make check build

  worker:
    name: Collection Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.13.15
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.11.33
          enable-cache: true
          cache-dependency-glob: apps/worker/uv.lock
      - run: uv sync --frozen --all-groups
      - run: make check build

  postgres:
    name: PostgreSQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
          cache-dependency-path: apps/api/go.sum
      - uses: actions/setup-python@v6
        with:
          python-version: 3.13.15
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.11.33
          enable-cache: true
          cache-dependency-glob: apps/worker/uv.lock
      - run: uv sync --project apps/worker --frozen --all-groups
      - run: bash -n infrastructure/postgres/init/10-create-test-database.sh scripts/postgres-wait.sh tests/postgres/compose-smoke.sh
      - run: shellcheck infrastructure/postgres/init/10-create-test-database.sh scripts/postgres-wait.sh tests/postgres/compose-smoke.sh
      - run: make db-smoke
      - run: make db-integration-test
