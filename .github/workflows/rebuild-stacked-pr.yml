name: Rebuild stacked PR

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rebuild-stacked-pr.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/issue-57-workspace-structure
          fetch-depth: 0
      - name: Rebuild Workspace head on latest main
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          BASE=$(git merge-base origin/main HEAD)
          git diff --binary "$BASE"..HEAD -- . ':(exclude).github/workflows/sync-main-for-merge.yml' > /tmp/pr.patch
          git reset --hard origin/main
          git apply --index --3way /tmp/pr.patch
          git commit -m "Rebuild Workspace changes on latest main (#57)"
          git push --force-with-lease origin HEAD:agent/issue-57-workspace-structure
