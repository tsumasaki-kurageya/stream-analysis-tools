openapi: 3.1.0
info:
  title: Stream Analysis Tools API
  version: 0.1.0
  description: HTTP contract for the stream analysis main API.
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Operations
    description: Operational endpoints used to observe service health.
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Check API health
      description: Reports whether the main API process is ready to accept requests.
      tags:
        - Operations
      responses:
        "200":
          description: The API is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        default:
          $ref: "#/components/responses/Problem"
components:
  responses:
    Problem:
      description: The request could not be completed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - component
        - status
      properties:
        component:
          type: string
          minLength: 1
          description: Component reporting its health.
          examples:
            - main-api
        status:
          type: string
          enum:
            - ok
          description: Current health status.
    ProblemDetails:
      type: object
      additionalProperties: true
      description: RFC 9457 Problem Details object. Extension members are allowed.
      properties:
        type:
          type: string
          format: uri-reference
          description: URI reference identifying the problem type; omitted values imply about:blank.
        title:
          type: string
          description: Short, human-readable summary of the problem type.
        status:
          type: integer
          minimum: 100
          maximum: 599
          description: HTTP status code generated by the origin server.
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          format: uri-reference
          description: URI reference identifying this problem occurrence.
