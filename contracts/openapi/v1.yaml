openapi: 3.1.0
info:
  title: Stream Analysis Tools API
  version: 0.5.0
  description: HTTP contract for the stream analysis main API.
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Operations
    description: Operational endpoints used to observe service health.
  - name: Streams
    description: YouTube stream metadata preview, registration, and retrieval.
  - name: Collections
    description: Background chat-replay collection orchestration and status.
  - name: Chat
    description: Persisted chat messages in stable stream-relative order.
  - name: Reservations
    description: Scheduled stream monitoring and automatic collection.
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Check API health
      description: Reports whether the main API process is ready to accept requests.
      tags:
        - Operations
      responses:
        "200":
          description: The API is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        default:
          $ref: "#/components/responses/Problem"
  /v1/streams/preview:
    post:
      operationId: previewStream
      summary: Preview a YouTube stream
      description: Validates a YouTube URL and fetches current metadata without persisting it.
      tags:
        - Streams
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StreamURLInput"
      responses:
        "200":
          description: Current metadata for the stream.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamPreview"
        "400":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/streams:
    post:
      operationId: createStream
      summary: Register a YouTube stream
      description: Revalidates current YouTube metadata and persists a new stream.
      tags:
        - Streams
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StreamURLInput"
      responses:
        "201":
          description: The stream was registered.
          headers:
            Location:
              description: Relative URL of the registered stream.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stream"
        "400":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    get:
      operationId: listStreams
      summary: List registered streams
      description: Returns registered streams with collection status and chat counts in reverse creation order with offset pagination.
      tags:
        - Streams
      parameters:
        - name: limit
          in: query
          description: Maximum number of streams to return.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          description: Number of streams to skip.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: A page of registered streams with analysis readiness data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamList"
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/streams/{streamId}:
    get:
      operationId: getStream
      summary: Get a registered stream
      description: Returns one registered stream by its internal identifier.
      tags:
        - Streams
      parameters:
        - name: streamId
          in: path
          required: true
          description: Internal stream identifier.
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
      responses:
        "200":
          description: The registered stream.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stream"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/streams/{streamId}/collections:
    post:
      operationId: startCollection
      summary: Start chat-replay collection
      description: >-
        Creates a queued collection job, or returns the already-active job for the stream.
        This operation accepts no request body or collector-specific options.
      tags:
        - Collections
      parameters:
        - $ref: "#/components/parameters/StreamId"
      responses:
        "202":
          description: The new or already-active collection job.
          headers:
            Location:
              description: Relative URL for polling the latest stream collection.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionJob"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/streams/{streamId}/collections/latest:
    get:
      operationId: getLatestCollection
      summary: Get latest collection status
      description: Returns the most recently requested collection job for the stream.
      tags:
        - Collections
      parameters:
        - $ref: "#/components/parameters/StreamId"
      responses:
        "200":
          description: Latest safe collection status and progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionJob"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/collection-jobs/{jobId}/retry:
    post:
      operationId: retryCollection
      summary: Retry a failed collection
      description: >-
        Creates a new queued job only when the failed job has a stable retryable error.
        This operation accepts no request body or collector-specific options.
      tags:
        - Collections
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "202":
          description: The new collection job.
          headers:
            Location:
              description: Relative URL for polling the stream's latest collection.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionJob"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/streams/{streamId}/chat-messages:
    get:
      operationId: listChatMessages
      summary: List persisted chat messages
      description: >-
        Returns messages ordered by offset milliseconds and message ID. The opaque cursor
        contains only the last returned offset and ID.
      tags:
        - Chat
      parameters:
        - $ref: "#/components/parameters/StreamId"
        - name: limit
          in: query
          description: Maximum number of messages to return.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          description: Opaque cursor returned by the previous page.
          schema:
            type: string
            minLength: 1
            maxLength: 256
      responses:
        "200":
          description: A stable page of chat messages.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessagePage"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/streams/{streamId}/chat-search:
    get:
      operationId: searchChatMessages
      summary: Search persisted chat messages
      description: >-
        Returns stream-scoped messages whose text contains the query, using a
        case-insensitive literal partial match. Results are ordered by offset
        milliseconds and message ID. The opaque cursor contains only the last
        returned offset and ID.
      tags:
        - Chat
      parameters:
        - $ref: "#/components/parameters/StreamId"
        - name: q
          in: query
          required: true
          description: Literal text to find within a chat message.
          schema:
            type: string
            minLength: 3
            maxLength: 100
        - name: limit
          in: query
          description: Maximum number of matching messages to return.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          description: Opaque cursor returned by the previous search page.
          schema:
            type: string
            minLength: 1
            maxLength: 256
      responses:
        "200":
          description: A stable page of matching chat messages.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessagePage"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/streams/{streamId}/chat-activity:
    get:
      operationId: getChatActivity
      summary: Get chat activity buckets
      description: Returns continuous stream-relative chat-count buckets for Timeline analysis.
      tags:
        - Chat
      parameters:
        - $ref: "#/components/parameters/StreamId"
        - name: bucketSeconds
          in: query
          description: Aggregation interval in seconds.
          schema:
            type: integer
            enum: [5, 10, 30]
            default: 10
      responses:
        "200":
          description: Continuous chat activity buckets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatActivity"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/reservations:
    post:
      operationId: createReservation
      summary: Create a stream reservation
      description: Registers a YouTube video for monitoring and automatic collection.
      tags:
        - Reservations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StreamURLInput"
      responses:
        "201":
          description: The reservation was created.
          headers:
            Location:
              description: Relative URL of the reservation.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "400":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    get:
      operationId: listReservations
      summary: List stream reservations
      description: Returns reservations in reverse creation order with offset pagination.
      tags:
        - Reservations
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: A page of reservations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationList"
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/reservations/{reservationId}:
    get:
      operationId: getReservation
      summary: Get a stream reservation
      description: Returns one reservation with safe monitoring and collection status.
      tags:
        - Reservations
      parameters:
        - $ref: "#/components/parameters/ReservationId"
      responses:
        "200":
          description: The reservation and its safe monitoring and collection status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/reservations/{reservationId}/cancel:
    post:
      operationId: cancelReservation
      summary: Cancel a stream reservation
      description: Cancels a reservation only while its current state supports cancellation.
      tags:
        - Reservations
      parameters:
        - $ref: "#/components/parameters/ReservationId"
      responses:
        "200":
          description: The canceled reservation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
components:
  parameters:
    StreamId:
      name: streamId
      in: path
      required: true
      description: Internal stream identifier.
      schema:
        type: string
        pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
    JobId:
      name: jobId
      in: path
      required: true
      description: Internal collection job identifier.
      schema:
        type: string
        pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
    ReservationId:
      name: reservationId
      in: path
      required: true
      description: Internal reservation identifier.
      schema:
        type: string
        pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
  responses:
    Problem:
      description: The request could not be completed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - component
        - status
      properties:
        component:
          type: string
          minLength: 1
          description: Component reporting its health.
          examples:
            - main-api
        status:
          type: string
          enum:
            - ok
          description: Current health status.
    StreamURLInput:
      type: object
      additionalProperties: false
      required:
        - url
      properties:
        url:
          type: string
          minLength: 1
          maxLength: 2048
          description: A supported YouTube watch, live, Shorts, embed, or youtu.be URL.
          examples:
            - https://www.youtube.com/watch?v=dQw4w9WgXcQ
    StreamPreview:
      type: object
      additionalProperties: false
      required:
        - youtubeVideoId
        - canonicalUrl
        - title
        - channelId
        - channelTitle
        - lifecycleStatus
        - metadataFetchedAt
      properties:
        youtubeVideoId:
          type: string
          minLength: 11
          maxLength: 11
        canonicalUrl:
          type: string
          format: uri
        title:
          type: string
          minLength: 1
        channelId:
          type: string
          minLength: 1
        channelTitle:
          type: string
          minLength: 1
        thumbnailUrl:
          type: string
          format: uri
        scheduledStartAt:
          type: string
          format: date-time
        actualStartAt:
          type: string
          format: date-time
        actualEndAt:
          type: string
          format: date-time
        durationMs:
          type: integer
          format: int64
          minimum: 0
        lifecycleStatus:
          $ref: "#/components/schemas/StreamLifecycleStatus"
        metadataFetchedAt:
          type: string
          format: date-time
    Stream:
      allOf:
        - $ref: "#/components/schemas/StreamPreview"
        - type: object
          additionalProperties: false
          required:
            - id
            - createdAt
            - updatedAt
          properties:
            id:
              type: string
              pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    StreamListItem:
      allOf:
        - $ref: "#/components/schemas/Stream"
        - type: object
          required:
            - chatMessageCount
          properties:
            collectionStatus:
              $ref: "#/components/schemas/CollectionJobStatus"
            chatMessageCount:
              type: integer
              format: int64
              minimum: 0
    StreamList:
      type: object
      additionalProperties: false
      required:
        - items
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/StreamListItem"
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          minimum: 0
    StreamLifecycleStatus:
      type: string
      enum:
        - unknown
        - scheduled
        - live
        - ended
        - unavailable
    Reservation:
      type: object
      additionalProperties: false
      required:
        - id
        - youtubeVideoId
        - sourceUrl
        - state
        - nextCheckAt
        - monitorAttempt
        - canCancel
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        youtubeVideoId:
          type: string
          minLength: 11
          maxLength: 11
        sourceUrl:
          type: string
          format: uri
        state:
          $ref: "#/components/schemas/ReservationState"
        scheduledStartAt:
          type: string
          format: date-time
        actualStartAt:
          type: string
          format: date-time
        actualEndAt:
          type: string
          format: date-time
        nextCheckAt:
          type: string
          format: date-time
        lastCheckedAt:
          type: string
          format: date-time
        monitorAttempt:
          type: integer
          minimum: 0
        lastErrorCode:
          type: string
        lastErrorMessage:
          type: string
        lastErrorRetryable:
          type: boolean
        streamId:
          type: string
          format: uuid
        collectionJobId:
          type: string
          format: uuid
        collectionStatus:
          $ref: "#/components/schemas/CollectionJobStatus"
        collectionError:
          $ref: "#/components/schemas/CollectionError"
        canCancel:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ReservationState:
      type: string
      enum:
        - scheduled
        - monitoring
        - live
        - waiting_for_archive
        - collecting
        - completed
        - failed
        - canceled
    ReservationList:
      type: object
      additionalProperties: false
      required:
        - items
        - total
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Reservation"
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          minimum: 0
    CollectionJob:
      type: object
      additionalProperties: false
      required:
        - id
        - streamId
        - kind
        - status
        - attempt
        - processedCount
        - skippedCount
        - requestedAt
        - updatedAt
      properties:
        id:
          type: string
          pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
        streamId:
          type: string
          pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
        kind:
          type: string
          enum:
            - chat_replay
        status:
          $ref: "#/components/schemas/CollectionJobStatus"
        attempt:
          type: integer
          minimum: 0
        currentStep:
          type: string
          enum:
            - chat_replay
        processedCount:
          type: integer
          format: int64
          minimum: 0
        skippedCount:
          type: integer
          format: int64
          minimum: 0
        requestedAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        error:
          $ref: "#/components/schemas/CollectionError"
    CollectionJobStatus:
      type: string
      enum:
        - queued
        - running
        - succeeded
        - no_data
        - failed
    CollectionError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - retryable
      properties:
        code:
          type: string
          pattern: "^[A-Z][A-Z0-9_]*$"
        message:
          type: string
          minLength: 1
        retryable:
          type: boolean
    ChatActivityBucket:
      type: object
      additionalProperties: false
      required:
        - startOffsetMilliseconds
        - messageCount
      properties:
        startOffsetMilliseconds:
          type: integer
          format: int64
          minimum: 0
        messageCount:
          type: integer
          format: int64
          minimum: 0
    ChatActivity:
      type: object
      additionalProperties: false
      required:
        - bucketSeconds
        - items
      properties:
        bucketSeconds:
          type: integer
          enum: [5, 10, 30]
        items:
          type: array
          items:
            $ref: "#/components/schemas/ChatActivityBucket"
    ChatMessage:
      type: object
      additionalProperties: false
      required:
        - id
        - authorDisplayName
        - messageText
        - publishedAt
        - offsetMilliseconds
        - messageType
      properties:
        id:
          type: string
          pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
        authorChannelId:
          type: string
          minLength: 1
        authorDisplayName:
          type: string
          minLength: 1
        messageText:
          type: string
          minLength: 1
        publishedAt:
          type: string
          format: date-time
        offsetMilliseconds:
          type: integer
          format: int64
        messageType:
          type: string
          enum:
            - text
    ChatMessagePage:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        nextCursor:
          type: string
          minLength: 1
          maxLength: 256
    ProblemDetails:
      type: object
      additionalProperties: true
      description: RFC 9457 Problem Details object with a stable product-level code.
      required:
        - title
        - status
        - detail
        - code
      properties:
        type:
          type: string
          format: uri-reference
          description: URI reference identifying the problem type; omitted values imply about:blank.
        title:
          type: string
          description: Short, human-readable summary of the problem type.
        status:
          type: integer
          minimum: 100
          maximum: 599
          description: HTTP status code generated by the origin server.
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          format: uri-reference
          description: URI reference identifying this problem occurrence.
        code:
          type: string
          pattern: "^[A-Z][A-Z0-9_]*$"
          description: Stable machine-readable product error code.
